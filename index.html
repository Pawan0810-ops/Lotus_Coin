<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotus Coin (LOTUS) Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        async function fetchNodeStatus() {
            try {
                let res = await fetch("http://127.0.0.1:8080/api/status");
                let data = await res.json();
                document.getElementById("node-status").innerText = data.status;
                document.getElementById("chain-length").innerText = data.chain_length;
                document.getElementById("mempool-txs").innerText = data.mempool_pending_txs;
                document.getElementById("latest-hash").innerText = data.latest_block_hash;
                document.getElementById("staked-amount").innerText = data.staked_amount + " LOTUS";
            } catch (e) {
                document.getElementById("node-status").innerText = "OFFLINE (Start local Docker node)";
            }
        }

        async function fetchBlocks() {
            try {
                let res = await fetch("http://127.0.0.1:8080/api/blocks");
                let blocks = await res.json();
                let tbody = document.getElementById("blocks-table");
                tbody.innerHTML = "";
                blocks.reverse().forEach(b => {
                    tbody.innerHTML += `
                        <tr class="border-b border-gray-700 hover:bg-gray-800">
                            <td class="p-3 font-mono">#${b.index}</td>
                            <td class="p-3 font-mono text-xs truncate max-w-xs">${b.hash}</td>
                            <td class="p-3 font-mono text-xs truncate max-w-xs">${b.prev_hash}</td>
                            <td class="p-3 font-mono">${b.nonce}</td>
                            <td class="p-3 font-mono">${b.tx_count}</td>
                        </tr>`;
                });
            } catch (e) {
                console.log("Could not fetch blocks");
            }
        }

        async function triggerAction(endpoint, msg) {
            let res = await fetch("http://127.0.0.1:8080" + endpoint);
            let data = await res.json();
            alert(msg + ": " + JSON.stringify(data));
            fetchNodeStatus();
            fetchBlocks();
        }

        setInterval(() => {
            fetchNodeStatus();
            fetchBlocks();
        }, 3000);
        window.onload = () => { fetchNodeStatus(); fetchBlocks(); };
    </script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen p-6">
    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-8 border-b border-gray-800 pb-4">
            <div>
                <h1 class="text-3xl font-bold text-pink-500">🌸 Lotus Coin Explorer</h1>
                <p class="text-sm text-gray-400">High-Performance Hybrid PoW/PoS Modular C++ Blockchain</p>
            </div>
            <div>
                <span id="node-status" class="px-3 py-1 bg-green-900 text-green-300 rounded-full text-xs font-bold animate-pulse">CONNECTING...</span>
            </div>
        </header>

        <!-- Stats Grid -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-gray-800 p-4 rounded-lg border border-gray-700">
                <p class="text-xs text-gray-400 uppercase">Chain Length</p>
                <p id="chain-length" class="text-2xl font-bold text-pink-400">-</p>
            </div>
            <div class="bg-gray-800 p-4 rounded-lg border border-gray-700">
                <p class="text-xs text-gray-400 uppercase">Pending Txs</p>
                <p id="mempool-txs" class="text-2xl font-bold text-blue-400">-</p>
            </div>
            <div class="bg-gray-800 p-4 rounded-lg border border-gray-700">
                <p class="text-xs text-gray-400 uppercase">Staked Amount</p>
                <p id="staked-amount" class="text-2xl font-bold text-purple-400">-</p>
            </div>
            <div class="bg-gray-800 p-4 rounded-lg border border-gray-700 flex flex-col justify-between">
                <p class="text-xs text-gray-400 uppercase">Node Actions</p>
                <div class="flex gap-2 mt-2">
                    <button onclick="triggerAction('/api/stake', 'Stake Response')" class="bg-purple-600 hover:bg-purple-700 text-xs px-3 py-1 rounded font-bold">Stake</button>
                    <button onclick="triggerAction('/api/mine', 'Mine Response')" class="bg-pink-600 hover:bg-pink-700 text-xs px-3 py-1 rounded font-bold">Mine</button>
                </div>
            </div>
        </div>

        <!-- Latest Hash Card -->
        <div class="bg-gray-800 p-4 rounded-lg border border-gray-700 mb-8 font-mono text-xs">
            <span class="text-gray-400">Latest Block Hash:</span> <span id="latest-hash" class="text-green-400 break-all">-</span>
        </div>

        <!-- Blocks Table -->
        <div class="bg-gray-800 rounded-lg border border-gray-700 overflow-hidden">
            <div class="p-4 bg-gray-750 border-b border-gray-700 font-bold">Recent Blockchain Ledger</div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-750 text-gray-400 text-xs uppercase border-b border-gray-700">
                            <th class="p-3">Index</th>
                            <th class="p-3">Hash</th>
                            <th class="p-3">Previous Hash</th>
                            <th class="p-3">Nonce</th>
                            <th class="p-3">Txs</th>
                        </tr>
                    </thead>
                    <tbody id="blocks-table">
                        <!-- Dynamic rows injected here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
