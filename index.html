<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotus Coin | Decentralized Network Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #ec4899;
            --text-color: #f8fafc;
            --border-color: #334155;
            --success-color: #22c55e;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        h1 {
            color: var(--accent-color);
            margin: 0;
        }

        .status-badge {
            background-color: rgba(34, 197, 94, 0.2);
            color: var(--success-color);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            border: 1px solid var(--success-color);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .card h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
            color: #94a3b8;
            text-transform: uppercase;
        }

        .card .value {
            font-size: 24px;
            font-weight: bold;
            color: var(--text-color);
            word-break: break-all;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 30px;
            border: 1px solid var(--border-color);
        }

        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
        }

        th {
            background-color: #0f172a;
            color: #94a3b8;
            text-transform: uppercase;
            font-size: 12px;
        }

        .console-box {
            background-color: #020617;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            font-family: 'Courier New', Courier, monospace;
            height: 180px;
            overflow-y: auto;
        }

        .log-entry { margin-bottom: 6px; font-size: 13px; }
        .log-time { color: #64748b; }
        .log-info { color: #38bdf8; }
        .log-success { color: var(--success-color); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🌸 Lotus Coin Network Dashboard</h1>
        <div id="nodeStatus" class="status-badge">CONNECTING...</div>
    </header>

    <div class="grid">
        <div class="card">
            <h3>Chain Height</h3>
            <div id="chainLength" class="value">0</div>
        </div>
        <div class="card">
            <h3>Mempool Txs</h3>
            <div id="mempoolSize" class="value">0</div>
        </div>
        <div class="card">
            <h3>Treasury Pool</h3>
            <div id="treasuryPool" class="value">0.0 LOTUS</div>
        </div>
        <div class="card">
            <h3>Active Validator Stake</h3>
            <div id="stakedAmount" class="value" style="color: #38bdf8;">0.0 LOTUS</div>
        </div>
    </div>

    <div class="actions">
        <button onclick="triggerMine()">⛏️ Mine Block</button>
        <button onclick="sendTransaction()" style="background-color: #3b82f6;">💸 Send Priority Tx</button>
        <button onclick="stakeTokens()" style="background-color: #10b981;">🔒 Stake 25 LOTUS</button>
        <button onclick="unstakeTokens()" style="background-color: #f59e0b;">🔓 Unstake 25 LOTUS</button>
        <button onclick="generateWallet()" style="background-color: #8b5cf6;">🔑 Generate Wallet</button>
    </div>

    <h3>🔍 Live Block Explorer</h3>
    <table>
        <thead>
            <tr>
                <th>Index</th>
                <th>Block Hash</th>
                <th>Prev Hash</th>
                <th>Nonce</th>
                <th>Txs</th>
            </tr>
        </thead>
        <tbody id="blockExplorerBody">
            <tr><td colspan="5">Loading chain data...</td></tr>
        </tbody>
    </table>

    <h3>Live Network Activity Logs</h3>
    <div id="consoleLogs" class="console-box"></div>
</div>

<script>
    const NODE_URL = "http://127.0.0.1:8080";

    function log(msg, type = "info") {
        const consoleBox = document.getElementById("consoleLogs");
        const time = new Date().toLocaleTimeString();
        const entry = document.createElement("div");
        entry.className = "log-entry";
        entry.innerHTML = `<span class="log-time">[${time}]</span> <span class="log-${type}">${msg}</span>`;
        consoleBox.prepend(entry);
    }

    async function fetchStatus() {
        try {
            const res = await fetch(`${NODE_URL}/api/status`);
            const data = await res.json();
            
            document.getElementById("nodeStatus").innerText = "NODE ONLINE";
            document.getElementById("chainLength").innerText = data.chain_length;
            document.getElementById("mempoolSize").innerText = data.mempool_pending_txs;
            document.getElementById("treasuryPool").innerText = `${data.treasury_pool.toFixed(2)} LOTUS`;
            document.getElementById("stakedAmount").innerText = `${data.staked_amount.toFixed(2)} LOTUS`;
        } catch (err) {
            document.getElementById("nodeStatus").innerText = "OFFLINE";
            document.getElementById("nodeStatus").style.borderColor = "#ef4444";
            document.getElementById("nodeStatus").style.color = "#ef4444";
        }
    }

    async function fetchBlocks() {
        try {
            const res = await fetch(`${NODE_URL}/api/blocks`);
            const blocks = await res.json();
            const tbody = document.getElementById("blockExplorerBody");
            tbody.innerHTML = "";

            blocks.reverse().forEach(b => {
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td><b>#${b.index}</b></td>
                    <td style="color: #38bdf8; font-family: monospace;">${b.hash.substr(0, 20)}...</td>
                    <td style="color: #64748b; font-family: monospace;">${b.prev_hash.substr(0, 16)}...</td>
                    <td>${b.nonce}</td>
                    <td><span style="background:#334155; padding:2px 8px; border-radius:10px;">${b.tx_count}</span></td>
                `;
                tbody.appendChild(row);
            });
        } catch (err) {}
    }

    async function triggerMine() {
        log("Mining Block...", "info");
        try {
            const res = await fetch(`${NODE_URL}/api/mine`);
            const data = await res.json();
            log(`Block Mined! Hash: ${data.mined_hash.substr(0, 24)}...`, "success");
            fetchStatus();
            fetchBlocks();
        } catch (err) { log("Mining failed", "error"); }
    }

    async function sendTransaction() {
        log("Submitting Priority Tx...", "info");
        try {
            const res = await fetch(`${NODE_URL}/api/send`);
            const data = await res.json();
            log(`Tx Queued! Gas Fee: ${data.gas_fee} LOTUS`, "success");
            fetchStatus();
        } catch (err) { log("Tx failed", "error"); }
    }

    async function stakeTokens() {
        log("Staking 25 LOTUS...", "info");
        try {
            const res = await fetch(`${NODE_URL}/api/stake`);
            const data = await res.json();
            log(data.message, "success");
            fetchStatus();
        } catch (err) { log("Staking failed", "error"); }
    }

    async function unstakeTokens() {
        log("Unstaking 25 LOTUS...", "info");
        try {
            const res = await fetch(`${NODE_URL}/api/unstake`);
            const data = await res.json();
            log(data.message, "success");
            fetchStatus();
        } catch (err) { log("Unstaking failed", "error"); }
    }

    async function generateWallet() {
        try {
            const res = await fetch(`${NODE_URL}/api/wallet/generate`);
            const data = await res.json();
            log(`Wallet Generated: ${data.address}`, "success");
        } catch (err) { log("Wallet generation failed", "error"); }
    }

    setInterval(() => { fetchStatus(); fetchBlocks(); }, 2000);
    fetchStatus();
    fetchBlocks();
</script>

</body>
</html>
