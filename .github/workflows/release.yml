name: Lotus Coin Multi-Platform Binary Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux x64 Binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev libleveldb-dev tar

      - name: Compile Executable
        run: |
          mkdir -p build
          cd build
          cmake ..
          make -j$(nproc)

      - name: Package Linux Binary
        run: |
          tar -czvf lotus_node-linux-x64.tar.gz -C build lotus_node

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lotus_node-linux-x64
          path: lotus_node-linux-x64.tar.gz

  create-release:
    name: Create GitHub Release & Upload Assets
    needs: [build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: lotus_node-linux-x64

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            lotus_node-linux-x64.tar.gz
          name: "Lotus Coin Release ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
